# The framework's own tests are the framework's own argument. If nothing runs them,
# the Conscience is prose. This is the part that runs them.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate wrapper checksum
        uses: gradle/actions/wrapper-validation@v6

  build:
    name: Build and test
    needs: wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The runner image does not carry SDK 37, and the Android target needs it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 platforms;android-37.1 build-tools;37.0.0'

      - name: Build and test
        run: ./gradlew build --stacktrace

      # A failing test that nobody can read is a failing test nobody fixes.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
          if-no-files-found: ignore
