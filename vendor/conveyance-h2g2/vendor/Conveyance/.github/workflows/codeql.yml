name: "KMP Security Pipeline"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-and-scan:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    # Set up JDK 21 environment required for modern Kotlin compilation
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle' # Automatically caches Gradle dependencies for faster runs

    # The Android target will not configure without an SDK, and the runner image has no SDK 37.
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platforms;android-37.0 platforms;android-37.1 build-tools;37.0.0'

    # Run open-source detekt across all KMP targets via Gradle
    - name: Run detekt Code Quality Scan
      run: |
        chmod +x ./gradlew
        ./gradlew detekt

    # Snyk needs a token. Without one these steps fail on authentication rather than on anything
    # about this code, so they run only when the secret is actually configured.
    - name: Check for Snyk credentials
      id: snyk
      run: echo "configured=${{ secrets.SNYK_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

    # Both Snyk steps run the CLI on the host rather than through snyk/actions/*.
    #
    # Those actions run in Docker and pass -e "JAVA_HOME" from the runner into the container, so the
    # container inherits a path to a JDK that exists only on the host. Every Gradle analysis died
    # with "JAVA_HOME is set to an invalid directory" before reading a line of this repository --
    # and switching to the gradle-jdk21 image does not help, because the inherited variable
    # overrides the JDK that image ships. On the host, JAVA_HOME is correct and the Android SDK is
    # already installed, which is what Gradle needs to configure this build at all.

    # SAST over the source. Gated behind a repository variable because Snyk Code is separately
    # licensed: without it the scan returns 403 SNYK-CODE-0005 on every run, forever, and a check
    # that can never pass is not a check -- it is a red light that teaches everyone to stop reading
    # CI. Enable Snyk Code at app.snyk.io, then set SNYK_CODE_ENABLED to true.
    - name: Run Snyk Code Security Scan
      if: steps.snyk.outputs.configured == 'true' && vars.SNYK_CODE_ENABLED == 'true'
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        npm install -g snyk
        snyk code test --severity-threshold=high

    # SCA over the dependency graph. --all-sub-projects because this is a multi-module build and the
    # root project declares almost nothing.
    - name: Run Snyk Dependency Scan
      if: steps.snyk.outputs.configured == 'true'
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        npm install -g snyk
        snyk monitor --all-sub-projects
