[versions]
# Toolchain baseline. AGP 9.3+ is a project requirement, and it sets the Gradle floor.
#
# Pinned to the 9.4 release candidate, not the 9.3.2 stable release, specifically for its bumped
# BouncyCastle (1.79 -> 1.80.2): AGP bundles its own bcprov-jdk18on/bcpkix-jdk18on for APK signing,
# and 1.79 carries CVE-2025-14813 (GOST 28147 CTR mode keystream reuse after 255 blocks, Critical) --
# fixed upstream at 1.84, with 1.80.2/1.81.1 as backported-fix point releases. No stable AGP release
# carries the fix yet. Checked 9.5.0-alpha03 too: it resolves the same BC 1.80.2 as this RC, so
# there's nothing to gain from the extra alpha-grade instability -- reconsider only if a later
# stable AGP (9.4.0 final or newer) ships, at which point drop back to a stable pin.
agp = "9.4.0-rc02"
gradle = "9.7.1"
kotlin = "2.4.10"
# Compose Multiplatform: latest stable plugin.
compose = "1.12.0"
# material3 is taken at alpha deliberately: the Expressive shape-morph machinery
# (MaterialShapes, Morph) lives there and nowhere else. Used as geometry, never as
# a channel vocabulary -- Conveyance assigns its own meanings and cannot import M3's.
androidxMaterial3 = "1.5.0-alpha27"
compileSdk = "37"
compileSdkMinor = "1"
minSdk = "24"
coroutines = "1.11.0"
# detekt: required by the KMP Security Pipeline workflow, which runs ./gradlew detekt.
detekt = "1.23.8"
# The generated API reference, built from the KDoc already written throughout the codebase.
dokka = "2.2.0"
# The auditor calls Claude to run the two rules no structural check can settle.
anthropic = "2.60.0"
jackson = "2.22.2"
jvmToolchain = "21"
# The Android entry point (conveyance-demo-android) is a plain, non-KMP application module --
# AGP 9 forbids com.android.application and the KMP library plugin in the same module -- so it
# needs its own Activity host, which needs its own version of the bridge between the two.
androidxActivityCompose = "1.13.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "6.1.3" }
androidx-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidxMaterial3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

[plugins]
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# AGP 9 dropped com.android.library for Kotlin Multiplatform; this is its replacement.
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
# The one plugin a KMP module is not allowed to carry alongside it -- reserved for the plain
# Android application module that actually launches something on a phone.
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
