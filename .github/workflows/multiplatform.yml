name: Multiplatform Build

on:
  push:
    branches:
      - architecture/geministrator-2
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android
        run: ./gradlew :androidApp:assembleDebug

      - name: Build Desktop
        run: ./gradlew :desktopApp:compileKotlin

      - name: Build Web JS
        run: ./gradlew :webApp:jsBrowserProductionWebpack

      - name: Build Web Wasm
        run: ./gradlew :webApp:wasmJsBrowserProductionWebpack
