name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: geministrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out pinned h2g2
        uses: actions/checkout@v5
        with:
          repository: HereLiesAz/conveyance-h2g2
          ref: faa80ed5aa063f6bdab42163d7b021123b248254
          path: vendor/conveyance-h2g2

      - name: Check out pinned Conveyance
        uses: actions/checkout@v5
        with:
          repository: HereLiesAz/Conveyance
          ref: 468371de06a903b1a6bdcf812197eef4a81afd3e
          path: vendor/conveyance-h2g2/vendor/Conveyance

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare Android signing key when available
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
        run: |
          if [ -z "$KEYSTORE_RAW" ]; then
            echo "KEYSTORE_RAW is not exposed to this workflow run; release will be built unsigned."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/geministrator-release.keystore"
          if printf '%s' "$KEYSTORE_RAW" | base64 --decode > "$KEYSTORE_PATH" 2>/dev/null; then
            echo "Decoded KEYSTORE_RAW as base64."
          else
            printf '%s' "$KEYSTORE_RAW" > "$KEYSTORE_PATH"
            echo "Used KEYSTORE_RAW as literal keystore content."
          fi
          echo "GEMINISTRATOR_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test shared domain
        run: ./gradlew :shared:desktopTest

      - name: Test Jules provider
        run: ./gradlew :providers:jules:desktopTest

      - name: Compile Jules provider Android
        run: ./gradlew :providers:jules:compileAndroidMain

      - name: Compile Jules provider JS
        run: ./gradlew :providers:jules:compileKotlinJs

      - name: Compile Jules provider Wasm
        run: ./gradlew :providers:jules:compileKotlinWasmJs

      - name: Build Android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease

      - name: Build Desktop distribution
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS

      - name: Build Web JS
        run: ./gradlew :webApp:jsBrowserProductionWebpack

      - name: Build Web Wasm
        run: ./gradlew :webApp:wasmJsBrowserProductionWebpack

      - name: Upload Android build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: geministrator-android-release
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Desktop build
        uses: actions/upload-artifact@v4
        with:
          name: geministrator-desktop-linux
          path: desktopApp/build/compose/binaries/main/**
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: webApp/build/dist/js/productionExecutable

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
