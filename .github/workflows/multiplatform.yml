name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: haive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out pinned h2g2
        uses: actions/checkout@v5
        with:
          repository: HereLiesAz/conveyance-h2g2
          ref: faa80ed5aa063f6bdab42163d7b021123b248254
          path: vendor/conveyance-h2g2

      - name: Check out pinned Conveyance
        uses: actions/checkout@v5
        with:
          repository: HereLiesAz/Conveyance
          ref: 468371de06a903b1a6bdcf812197eef4a81afd3e
          path: vendor/conveyance-h2g2/vendor/Conveyance

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Publish pinned h2g2 for isolated web resolution
        run: |
          mv vendor/conveyance-h2g2/vendor/Conveyance "$RUNNER_TEMP/haive-conveyance"
          sed -i 's/group = "com.hereliesaz.conveyance"/group = "com.github.HereLiesAz"/' vendor/conveyance-h2g2/build.gradle.kts
          sed -i 's/version = "0.1.0"/version = "faa80ed5aa063f6bdab42163d7b021123b248254"/' vendor/conveyance-h2g2/build.gradle.kts
          ./vendor/conveyance-h2g2/gradlew -p vendor/conveyance-h2g2 publishToMavenLocal
          mv "$RUNNER_TEMP/haive-conveyance" vendor/conveyance-h2g2/vendor/Conveyance

      - name: Reconstruct and verify Android signing keystore
        id: signing
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/android-keystore
        with:
          keystore-private: ${{ secrets.KEYSTORE_PRIVATE }}
          keystore-rsa: ${{ secrets.KEYSTORE_RSA }}
          keystore-public: ${{ secrets.KEYSTORE_PUBLIC }}
          keystore-chain: ${{ secrets.KEYSTORE_CHAIN }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          expected-sha256: ${{ secrets.KEYSTORE_SHA256 }}
          expected-sha1: ${{ secrets.KEYSTORE_SHA1 }}
          expected-owner: ${{ secrets.KEYSTORE_OWNER }}

      - name: Export Android signing path
        if: github.event_name != 'pull_request'
        run: |
          echo "HAIVE_KEYSTORE_PATH=${{ steps.signing.outputs.keystore-path }}" >> "$GITHUB_ENV"
          echo "HAIVE_KEYSTORE_TYPE=${{ steps.signing.outputs.store-type }}" >> "$GITHUB_ENV"

      - name: Test shared domain
        run: ./gradlew :shared:desktopTest

      - name: Test Jules provider
        run: ./gradlew :providers:jules:desktopTest

      - name: Compile Jules provider Android
        run: ./gradlew :providers:jules:compileAndroidMain

      - name: Compile Jules provider JS
        run: ./gradlew :providers:jules:compileKotlinJs

      - name: Compile Jules provider Wasm
        run: ./gradlew :providers:jules:compileKotlinWasmJs

      - name: Build Android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease

      - name: Build Desktop distribution
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS

      - name: Build Web JS
        run: ./gradlew -Phaive.useLocalH2g2=false -Phaive.useMavenLocalH2g2=true :webApp:jsBrowserProductionWebpack

      - name: Build Web Wasm
        run: ./gradlew -Phaive.useLocalH2g2=false -Phaive.useMavenLocalH2g2=true :webApp:wasmJsBrowserProductionWebpack

      - name: Upload Android build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: haive-android-release
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Desktop build
        uses: actions/upload-artifact@v4
        with:
          name: haive-desktop-linux
          path: desktopApp/build/compose/binaries/main/**
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: webApp/build/dist/js/productionExecutable

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
